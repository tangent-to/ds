name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# ds depends on its siblings (@tangent.to/lina, opt, proba) through published
# semver ranges, not file:../ specifiers, so npm install resolves them from the
# registry and no sibling checkout is needed.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4
        with:
          path: ds

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install --no-fund --no-audit
        working-directory: ds

      - name: Run tests
        run: npm run test:run
        working-directory: ds

      - name: Build browser bundle
        run: npm run build:browser
        working-directory: ds

      - name: Verify package
        run: npm run verify
        working-directory: ds

  lint:
    runs-on: ubuntu-latest
    # Blocking: src/ is lint-clean, so a new violation should fail CI rather
    # than scroll past in a green run.
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Lint
        run: deno lint src/
